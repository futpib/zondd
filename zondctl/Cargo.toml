[package]
name = "zondctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
libc = "0.2.190"
libzond = { version = "0.1.0", path = "../libzond" }
libzondctl = { version = "0.1.0", path = "../libzondctl" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }

[lints]
workspace = true

[dev-dependencies]
libzondtest = { path = "../libzondtest" }
