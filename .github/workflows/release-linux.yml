name: Release Linux binaries

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Require a version tag
        run: |
          if [[ $GITHUB_REF_TYPE != tag || ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Run this workflow on a vMAJOR.MINOR.PATCH tag matching Cargo.toml.' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --workspace --bins
      - run: cargo test --locked --release --workspace -- --test-threads=1
      - name: Package binaries and user service
        run: scripts/package-linux.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/linux-dist"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: ${{ runner.temp }}/linux-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Linux ${{ github.ref_name }}
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Linux user daemon and CLI for x86-64 and ARM64 (glibc 2.39 or newer).
            Each archive includes zondd, zondctl, the systemd user service, an optional example policy, and documentation.

            Install the binaries into ~/.cargo/bin and the service into ~/.config/systemd/user,
            then follow readme.md to enable the user service and enroll caller keys.

            Android APKs are published separately in releases titled Android.
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
