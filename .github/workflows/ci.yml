name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install SSH test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --locked --workspace --bins
      - run: cargo test --locked --workspace
      - name: Test real SSH and key enrollment
        run: |
          cargo test --locked -p zondctl --test integration -- --ignored --skip iroh_ssh --skip trusted_management
          cargo test --locked -p zondctl --test jobs -- --ignored --skip iroh_ssh
          cargo test --locked -p zondctl --test authorize -- --ignored
      - name: Prepare runner's systemd user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Test shipped user service
        run: |
          cargo test --locked -p zondd --test integration shipped_user_service -- --ignored
          cargo test --locked -p zondd --test service_rules -- --ignored
          cargo test --locked -p zondctl --test credential_api -- --ignored
      - name: Build and inspect Linux distribution
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          scripts/package-linux.sh "$version" "$RUNNER_TEMP/linux-dist"
          tar -tzf "$RUNNER_TEMP"/linux-dist/*.tar.gz

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install workflow and shell linters
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - run: actionlint
      - run: shellcheck scripts/*.sh android-app/scripts/*.sh
