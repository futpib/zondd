version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directories:
      - /
      - /android-app/native
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /android-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
