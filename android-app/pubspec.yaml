name: zondd_control
description: "SSH-authenticated approvals and control for zondd."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  dartssh2: ^4.1.0
  openkeychain_ssh:
    git:
      url: https://github.com/futpib/iroh-ssh-android.git
      ref: d7aa5f94d316d19522202f73ca3566ef9df94e59
      path: packages/openkeychain_ssh
  flutter_secure_storage: ^11.2.0
  ffi: ^2.2.0
  file_picker: ^13.1.0
  pinenacl: ^0.6.0
  crypto: ^3.0.7
  toml: ^0.18.0
  flutter_zxing: ^3.1.0
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:

  uses-material-design: true
