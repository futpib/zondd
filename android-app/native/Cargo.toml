[package]
name = "zondd_android_transport"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh-ssh = { git = "https://github.com/futpib/iroh-ssh", rev = "a53bfcc4545ac79fc17f898ca6157b1b3ca748fb", version = "0.2.8", default-features = false, features = ["flutter"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
rustls-platform-verifier = "0.7.1"
