# Install as ~/.config/zondd/config.toml. The daemon, commands, and approver
# all run as your user. Defaults follow XDG_CONFIG_HOME and XDG_RUNTIME_DIR.
# runtime_dir = "/run/user/1000/zondd" # optional override

[approvals]
enabled = true
# Set enabled = false to reject "ask" requests immediately; allow rules still work.
timeout_secs = 300
max_pending = 64

[limits]
command_timeout_secs = 60
max_output_bytes = 1048576
max_running = 8
max_connections = 128

[principals.automation]
cwd = "/"
allow_exec = true
default = "ask"
operations = ["service-status"]

# First matching rule wins. args is an exact argv match; omission means any argv.
[[principals.automation.rules]]
program = "/usr/bin/uptime"
args = []
decision = "allow"

# A hard denial never enters the approval queue.
[[principals.automation.rules]]
program = "/bin/sh"
decision = "deny"

[principals.monitor]
cwd = "/"
allow_exec = false
operations = ["service-status"]

[operations.service-status]
description = "Check the state of an explicitly listed service"
program = "/usr/bin/systemctl"
fixed_args = ["--user", "is-active", "--"]
arguments = [{ name = "service", choices = ["slopd.service", "zondd.service"] }]
decision = "allow"
