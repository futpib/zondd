[package]
name = "libzond"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
libc = "0.2.191"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["io-util", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
winnow = "1.0.4"
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
